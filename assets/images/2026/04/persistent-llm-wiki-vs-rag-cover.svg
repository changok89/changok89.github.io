<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#0B1020"/>
  <rect x="64" y="64" width="1472" height="772" rx="28" fill="#11182D" stroke="#26324F" stroke-width="2"/>
  <text x="104" y="142" fill="#93C5FD" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">Karpathy / LLM-Wiki / RAG</text>
  <text x="104" y="212" fill="#F4F7FF" font-family="Pretendard, Inter, sans-serif" font-size="50" font-weight="800">매번 다시 찾는 RAG보다</text>
  <text x="104" y="276" fill="#F4F7FF" font-family="Pretendard, Inter, sans-serif" font-size="50" font-weight="800">지식을 축적하는 위키가 더 중요할 수 있다</text>

  <rect x="104" y="338" width="620" height="384" rx="24" fill="#0D1527" stroke="#24314E" stroke-width="2"/>
  <text x="144" y="396" fill="#A5B4FC" font-family="Pretendard, Inter, sans-serif" font-size="26" font-weight="700">Why it matters</text>
  <text x="144" y="458" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• persistent knowledge</text>
  <text x="144" y="510" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• cross-reference updates</text>
  <text x="144" y="562" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• synthesis over time</text>
  <text x="144" y="614" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• bookkeeping automation</text>
  <text x="144" y="684" fill="#93C5FD" font-family="Pretendard, Inter, sans-serif" font-size="26" font-weight="700">Search helps. Accumulation compounds.</text>

  <rect x="786" y="338" width="650" height="384" rx="24" fill="#0D1527" stroke="#24314E" stroke-width="2"/>
  <rect x="846" y="404" width="190" height="70" rx="18" fill="#2563EB"/>
  <text x="901" y="447" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="800">RAG</text>
  <rect x="1146" y="404" width="230" height="70" rx="18" fill="#D97706"/>
  <text x="1196" y="447" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="800">WIKI</text>
  <line x1="1036" y1="439" x2="1146" y2="439" stroke="#93C5FD" stroke-width="6"/>
  <text x="848" y="542" fill="#BFDBFE" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">query-time retrieval</text>
  <text x="848" y="588" fill="#BFDBFE" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">re-discover each time</text>
  <text x="1150" y="542" fill="#FDE68A" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">persistent artifact</text>
  <text x="1150" y="588" fill="#FDE68A" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">compounding structure</text>
  <text x="1150" y="634" fill="#FDE68A" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">maintained by LLM</text>

  <text x="104" y="792" fill="#94A3B8" font-family="Pretendard, Inter, sans-serif" font-size="24" font-weight="600">Useful knowledge tools may shift from retrieval to accumulation.</text>
</svg>
