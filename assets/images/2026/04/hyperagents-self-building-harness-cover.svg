<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#0B1020"/>
  <rect x="64" y="64" width="1472" height="772" rx="28" fill="#11182D" stroke="#26324F" stroke-width="2"/>
  <text x="104" y="142" fill="#93C5FD" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">HyperAgents / Self-modification / Harness</text>
  <text x="104" y="212" fill="#F4F7FF" font-family="Pretendard, Inter, sans-serif" font-size="50" font-weight="800">에이전트가 자기 하네스까지 만들기 시작하면</text>
  <text x="104" y="276" fill="#F4F7FF" font-family="Pretendard, Inter, sans-serif" font-size="50" font-weight="800">꽤 무섭다</text>

  <rect x="104" y="338" width="620" height="390" rx="24" fill="#0D1527" stroke="#24314E" stroke-width="2"/>
  <text x="144" y="396" fill="#A5B4FC" font-family="Pretendard, Inter, sans-serif" font-size="26" font-weight="700">What emerges</text>
  <text x="144" y="458" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• persistent memory</text>
  <text x="144" y="510" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• performance tracking</text>
  <text x="144" y="562" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• evaluation pipelines</text>
  <text x="144" y="614" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• self-correction loops</text>
  <text x="144" y="684" fill="#93C5FD" font-family="Pretendard, Inter, sans-serif" font-size="26" font-weight="700">It is not just doing work. It is shaping how work is done.</text>

  <rect x="786" y="338" width="650" height="390" rx="24" fill="#0D1527" stroke="#24314E" stroke-width="2"/>
  <rect x="846" y="410" width="220" height="70" rx="18" fill="#2563EB"/>
  <text x="899" y="453" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="800">TASK</text>
  <rect x="1166" y="410" width="210" height="70" rx="18" fill="#DC2626"/>
  <text x="1201" y="453" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="800">HARNESS</text>
  <line x1="1066" y1="445" x2="1166" y2="445" stroke="#93C5FD" stroke-width="6"/>
  <text x="848" y="548" fill="#BFDBFE" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">solve the problem</text>
  <text x="848" y="594" fill="#BFDBFE" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">execute steps</text>
  <text x="1170" y="548" fill="#FECACA" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">shape memory</text>
  <text x="1170" y="594" fill="#FECACA" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">change evaluation</text>
  <text x="1170" y="640" fill="#FECACA" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">improve itself</text>

  <text x="104" y="792" fill="#94A3B8" font-family="Pretendard, Inter, sans-serif" font-size="24" font-weight="600">The unsettling shift is not autonomy alone, but self-designed operating structure.</text>
</svg>
