<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#0B1020"/>
  <rect x="64" y="64" width="1472" height="772" rx="28" fill="#11182D" stroke="#26324F" stroke-width="2"/>
  <text x="104" y="142" fill="#93C5FD" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">macOS / XNU / TCP bug</text>
  <text x="104" y="212" fill="#F4F7FF" font-family="Pretendard, Inter, sans-serif" font-size="52" font-weight="800">Mac도 오래 켜둘 거면</text>
  <text x="104" y="276" fill="#F4F7FF" font-family="Pretendard, Inter, sans-serif" font-size="52" font-weight="800">이제는 서버처럼 운영해야 한다</text>

  <rect x="104" y="338" width="620" height="390" rx="24" fill="#0D1527" stroke="#24314E" stroke-width="2"/>
  <text x="144" y="396" fill="#A5B4FC" font-family="Pretendard, Inter, sans-serif" font-size="26" font-weight="700">49-day TCP failure</text>
  <text x="144" y="458" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• ping still works</text>
  <text x="144" y="510" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• existing sessions survive</text>
  <text x="144" y="562" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• new TCP connections fail</text>
  <text x="144" y="614" fill="#E5EDFF" font-family="Pretendard, Inter, sans-serif" font-size="31" font-weight="700">• reboot required</text>
  <text x="144" y="684" fill="#93C5FD" font-family="Pretendard, Inter, sans-serif" font-size="26" font-weight="700">Desktop OS behavior, server-class impact.</text>

  <rect x="786" y="338" width="650" height="390" rx="24" fill="#0D1527" stroke="#24314E" stroke-width="2"/>
  <rect x="850" y="410" width="220" height="72" rx="18" fill="#2563EB"/>
  <text x="897" y="454" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="800">DESKTOP</text>
  <rect x="1176" y="410" width="190" height="72" rx="18" fill="#DC2626"/>
  <text x="1223" y="454" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="800">SERVER</text>
  <line x1="1070" y1="446" x2="1176" y2="446" stroke="#93C5FD" stroke-width="6"/>
  <text x="852" y="548" fill="#BFDBFE" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">casual uptime</text>
  <text x="852" y="594" fill="#BFDBFE" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">rarely noticed</text>
  <text x="1180" y="548" fill="#FECACA" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">CI runners</text>
  <text x="1180" y="594" fill="#FECACA" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">build farms</text>
  <text x="1180" y="640" fill="#FECACA" font-family="Pretendard, Inter, sans-serif" font-size="28" font-weight="700">automation hosts</text>

  <text x="104" y="792" fill="#94A3B8" font-family="Pretendard, Inter, sans-serif" font-size="24" font-weight="600">If a Mac runs like infrastructure, it needs server-style operations.</text>
</svg>
